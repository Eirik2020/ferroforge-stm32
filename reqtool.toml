# How reqtool reads this repository, as FerroHAL's does.
name = "ferroforge-stm32"
requirements = "src/requirements"
roots = "requirements/goals.md"
root_prefix = "G"
evidence = "requirements/evidence/runs"
artifacts = "requirements/evidence/logs"
boards = "hil"
test_features = [["stm32f401re"], ["stm32h753zi"]]
every_file_traced = true
every_file_traced_except = ["hil"]
tiers = ["HIL"]

[board_tiers]
nucleo-f401re-adc-scan = "HIL"
nucleo-f401re-exti-line = "HIL"
nucleo-f401re-uart-loopback = "HIL"
nucleo-f401re-rx-ports = "HIL"
nucleo-f401re-spi-loopback = "HIL"
nucleo-h753zi-adc-scan = "HIL"
nucleo-h753zi-lane-port = "HIL"
nucleo-h753zi-exti-line = "HIL"
nucleo-h753zi-spi-loopback = "HIL"
nucleo-h753zi-uart-loopback = "HIL"
stm32f4-discovery-lane-port = "HIL"
