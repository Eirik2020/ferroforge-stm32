schema_version: 2
requirements:
  - id: PORT-005
    title: A received chunk carries its end, generation and time
    statement: >-
      Each UART port shall hand its consumer each received chunk with why it
      ended, its generation, and the firmware monotonic's time read in the
      interrupt that took it.
    rationale: >-
      A serial protocol on top needs where the line went idle, where a gap
      fell, and when the data arrived, to frame and judge its data (D13,
      D17, D26).
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-007
        - level: unit
          environment: host
          method:
            library: ferrohal-stm32:UARTDMA-003
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-009

  - id: PORT-006
    title: Loss reaches the consumer as a gap at its place
    statement: >-
      Each UART port shall report every loss of received bytes to its
      consumer as a gap chunk at the place in the stream where the bytes
      went missing.
    rationale: >-
      Loss is never silent, and a decoder resynchronises at the gap instead
      of joining bytes across it (D19).
    derived_from: [PORT-005]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart_receive::tests::a_gap_chunk_reaches_the_consumer_at_its_place
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-008
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-009
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UARTDMA-011

  - id: PORT-007
    title: A starved receive side pushes back onto FerroHAL's ring
    statement: >-
      While its consumer holds every receive buffer, a UART port shall
      leave received bytes in FerroHAL's ring and take them once a buffer
      comes back.
    rationale: >-
      The interrupt never waits for the consumer, and bytes are lost only
      when the ring laps, which FerroHAL reports as a gap (D19).
    derived_from: [PORT-006]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart_receive::tests::a_chunk_is_read_in_place_and_a_starved_port_is_pended_on_release
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: unit
          environment: host
          method:
            library: ferrohal-stm32:UARTDMA-001
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UARTDMA-002
