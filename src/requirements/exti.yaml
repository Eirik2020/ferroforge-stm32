schema_version: 2
requirements:
  - id: PORT-301
    title: The EXTI line passes each edge to the firmware's task
    statement: >-
      The EXTI line's vector member shall clear its line's pending flag and pass
      each edge to the firmware's task, counting on the next edge passed the
      edges that found that task still queued.
    rationale: >-
      An edge carries no data, so one the task has not taken yet adds nothing
      but the fact that it happened; counting such edges keeps the vector
      bounded and still tells the firmware how many it did not see.
    derived_from: [G1, G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#EXTI line on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#EXTI line on the Nucleo-H753ZI

  - id: PORT-302
    title: The EXTI line stamps each edge in its vector
    statement: >-
      The EXTI line's vector member shall read the firmware's monotonic before
      it does anything else, and pass that time with the edge.
    rationale: >-
      A device that signals data ready by an edge is sampled at the edge, not
      when the firmware's task gets to run; a time read in the vector is the
      edge's at any task priority.
    derived_from: [G1, G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#EXTI line on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#EXTI line on the Nucleo-H753ZI
