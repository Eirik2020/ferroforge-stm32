schema_version: 2
requirements:
  - id: PORT-101
    title: The receive-only UART port serves its vectors and wakes the firmware
    statement: >-
      Each of the receive-only UART port's vector members shall serve the UART
      and pass the events of a nonempty service to the firmware's task.
    rationale: >-
      A receive-only link (ESC telemetry, an RC receiver) has no transmit pin
      or stream, so it needs one vector fewer than a full port; the port is how a
      firmware gets it served without writing the handlers.
    derived_from: [G1, G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Receive ports and ticks on the Nucleo-F401RE

  - id: PORT-121
    title: The SBUS group decodes a frame
    statement: >-
      The SBUS group shall decode a 25-byte chunk that the line ended, opening
      with 0x0F and closing with 0x00, into sixteen 11-bit channels packed
      least significant bit first and the flags byte's four flags.
    rationale: >-
      This is the SBUS frame as receivers send it, at 100 000 baud, 8E2;
      decoding it in the group keeps every firmware from carrying its own.
    derived_from: [G1]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::sbus::tests::a_frame_round_trips
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::sbus::tests::channels_are_packed_least_significant_bit_first
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::sbus::tests::the_line_is_sbus_framing

  - id: PORT-123
    title: The SBUS group counts anything but a frame as bad
    statement: >-
      The SBUS group shall count as bad any chunk that PORT-121 does not
      decode.
    rationale: >-
      SBUS has no length field or checksum, so the idle line and the framing
      bytes are the only test a frame passes; a chunk cut by a full buffer or
      struck by a line error is suspect whatever its bytes.
    derived_from: [PORT-121]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::sbus::tests::anything_but_a_frame_is_refused
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::sbus::tests::only_a_chunk_ended_by_an_idle_line_is_a_frame

  - id: PORT-122
    title: The SBUS group hands the firmware each wake's latest frame
    statement: >-
      When the receive-only port wakes it, the SBUS group shall read every
      whole chunk the UART holds and pass the latest good frame, with the
      running counts of good frames and bad chunks, to the firmware's task.
    rationale: >-
      A flight stack wants the newest sticks, not a queue of old ones; the
      counts let it judge the link without seeing every frame.
    derived_from: [PORT-101, PORT-121, PORT-123]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Receive ports and ticks on the Nucleo-F401RE
