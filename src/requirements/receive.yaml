schema_version: 2
requirements:
  - id: PORT-101
    title: The receive-only UART port's consumer needs no lock
    statement: >-
      The receive-only UART port shall give its consumer a handle that
      receives without naming the UART, its wiring, its vectors or a lock.
    rationale: >-
      A device that only sends has no transmit pin or stream, so its link
      needs a port with one vector fewer (D29). As in the full port (D20), the
      members own the UART, so a consumer never delays the port's interrupts.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Receive-only UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-003

  - id: PORT-102
    title: Every receive-only port's handle has one type
    statement: >-
      Every receive-only UART port's handle shall have one type, whatever its
      UART, wiring and pool.
    rationale: >-
      The firmware then decides in `init` which task gets which receive-only
      UART, as it does for full ports (D12).
    derived_from: [PORT-101]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Receive-only UART port on the STM32F4 Discovery

  - id: PORT-103
    title: The receive-only constructor refuses an unusable pool before opening
    statement: >-
      The receive-only UART port's constructor shall refuse a pool buffer it
      cannot use before it opens the UART, handing back the wiring and the
      ring.
    rationale: >-
      A refusal never carries an opened driver, the rule the full port's
      constructor follows (PORT-011), and the firmware can reuse what it gets
      back.
    derived_from: [PORT-101]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart_receive::tests::pool_buffers_the_port_cannot_use_are_refused
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-004
