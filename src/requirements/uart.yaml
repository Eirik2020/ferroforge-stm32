schema_version: 2
requirements:
  - id: PORT-003
    title: The UART port's consumer needs no lock
    statement: >-
      The UART port shall give its consumer a handle that receives and sends
      without naming the UART, its wiring, its vectors or a lock.
    rationale: >-
      The port's members own the UART (design record D20), so a consumer at
      any priority never delays the port's interrupts, and one consumer
      serves any UART.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-003

  - id: PORT-004
    title: Every UART port's handle has one type
    statement: >-
      Every UART port's handle shall have one type, whatever its UART,
      wiring and buffers.
    rationale: >-
      The firmware then decides in `init` which task gets which UART, so one
      image can offer configurable serial ports (D12).
    derived_from: [PORT-003]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery

  - id: PORT-008
    title: A frame is sent whole from the consumer's buffer
    statement: >-
      The UART port shall send each submitted frame as one frame from the
      buffer the consumer wrote it in, up to the length of the longest
      buffer the firmware lent the handle.
    rationale: >-
      The longest frame is the firmware's choice, not a fixed slot: a
      280-byte MAVLink 2 frame goes whole, written in place with no copy
      before FerroHAL's (D23).
    derived_from: [PORT-003]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-010
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-011
        - level: unit
          environment: host
          method:
            library: ferrohal-stm32:UARTDMA-006

  - id: PORT-009
    title: Each frame comes back in order with its outcome
    statement: >-
      The UART port shall give each submitted frame's buffer back to its
      consumer, in the order submitted, with the frame's outcome.
    rationale: >-
      The consumer learns what it wrote has gone, frame by frame, and reuses
      the buffer (D15, D23). A frame is never reported sent unless FerroHAL
      counted it sent.
    derived_from: [PORT-008]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::a_frame_is_refused_until_a_buffer_is_free_and_comes_back_in_order
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::frames_finished_together_are_never_reported_sent_unless_known
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::a_halted_transmitter_returns_every_frame_in_flight_failed
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-010
        - level: unit
          environment: host
          method:
            library: ferrohal-stm32:UARTDMA-007
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UARTDMA-012

  - id: PORT-010
    title: A frame with no buffer free is refused
    statement: >-
      The UART port's handle shall refuse a frame for which no free buffer
      is long enough, without losing a frame already submitted.
    rationale: >-
      Running out of lent buffers is a scheduler error the port defines
      (D8); the consumer retries once a frame comes back.
    derived_from: [PORT-008]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::a_frame_is_refused_until_a_buffer_is_free_and_comes_back_in_order
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery

  - id: PORT-011
    title: The constructor refuses unusable buffers before opening the UART
    statement: >-
      The UART port's constructor shall refuse a lent buffer it cannot use
      before it opens the UART, handing back the wiring and the buffers.
    rationale: >-
      A refusal never carries an opened driver: refusing with one cost about
      11 KB of init code with two UARTs (UART prototype 2 results), and the
      firmware can reuse what it gets back.
    derived_from: [PORT-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::buffers_the_port_cannot_use_are_refused
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-004
