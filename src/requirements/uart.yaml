  - id: PORT-010
    title: A frame with no buffer free is refused
    statement: >-
      The UART port's handle shall refuse a frame for which no free buffer
      is long enough, without losing a frame already submitted.
    rationale: >-
      Running out of lent buffers is a scheduler error the port defines
      (D8); the consumer retries once a frame comes back.
    derived_from: [PORT-008]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::a_frame_is_refused_until_a_buffer_is_free_and_comes_back_in_order
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-H753ZI
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery

  - id: PORT-011
    title: The constructor refuses unusable buffers before opening the UART
    statement: >-
      The UART port's constructor shall refuse a lent buffer it cannot use
      before it opens the UART, handing back the wiring and the buffers.
    rationale: >-
      A refusal never carries an opened driver: refusing with one cost about
      11 KB of init code with two UARTs (UART prototype 2 results), and the
      firmware can reuse what it gets back.
    derived_from: [PORT-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::buffers_the_port_cannot_use_are_refused
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-004
