schema_version: 2
requirements:
  - id: PORT-003
    title: The UART port's consumer needs no lock
    statement: >-
      The UART port shall give its consumer a handle that receives and sends
      without naming the UART, its wiring, its vectors or a lock.
    rationale: >-
      The port's members own the UART (design record D20), so a consumer at
      any priority never delays the port's interrupts, and one consumer
      serves any UART.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-H753ZI
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            library: ferrohal-stm32:UART-003

  - id: PORT-004
    title: Every UART port's handle has one type
    statement: >-
      Every UART port's handle shall have one type, whatever its UART,
      wiring and buffers.
    rationale: >-
      The firmware then decides in `init` which task gets which UART, so one
      image can offer configurable serial ports (D12).
    derived_from: [PORT-003]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the Nucleo-H753ZI
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART port on the STM32F4 Discovery

  - id: PORT-005
    title: A received chunk carries its end, generation and time
    statement: >-
      The UART port shall hand its consumer each received chunk with why it
      ended, its generation, and the firmware monotonic's time read in the
      interrupt that took it.
    rationale: >-
      A serial protocol on top needs where the line went idle, where a gap
      fell, and when the data arrived, to frame and judge its data (D13,
      D17, D26).
    derived_from: [PORT-003]
    verification:
      entries:
