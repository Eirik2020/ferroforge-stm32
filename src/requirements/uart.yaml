  - id: PORT-009
    title: Each frame comes back in order with its outcome
    statement: >-
      The UART port shall give each submitted frame's buffer back to its
      consumer, in the order submitted, with the frame's outcome.
    rationale: >-
      The consumer learns what it wrote has gone, frame by frame, and reuses
      the buffer (D15, D23). A frame is never reported sent unless FerroHAL
      counted it sent.
    derived_from: [PORT-008]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferroforge_stm32::uart::tests::a_frame_is_refused_until_a_buffer_is_free_and_comes_back_in_order
        - level: unit
          environment: host
          method:
