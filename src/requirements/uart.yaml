  - id: PORT-008
    title: A frame is sent whole from the consumer's buffer
    statement: >-
      The UART port shall send each submitted frame as one frame from the
      buffer the consumer wrote it in, up to the length of the longest
      buffer the firmware lent the handle.
    rationale: >-
      The longest frame is the firmware's choice, not a fixed slot: a
      280-byte MAVLink 2 frame goes whole, written in place with no copy
      before FerroHAL's (D23).
    derived_from: [PORT-003]
    verification:
