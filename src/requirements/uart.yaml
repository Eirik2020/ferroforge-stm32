  - id: PORT-006
    title: Loss reaches the consumer as a gap at its place
    statement: >-
      The UART port shall report every loss of received bytes to its
      consumer as a gap chunk at the place in the stream where the bytes
      went missing.
    rationale: >-
      Loss is never silent, and a decoder resynchronises at the gap instead
      of joining bytes across it (D19).
    derived_from: [PORT-005]
    verification:
      entries:
        - level: unit
          environment: host
          method:
