[package]
name = "nucleo-f401re-rx-ports"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rx-ports"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferroforge-stm32 = { path = "../.." }
ferroforge = { git = "https://github.com/Eirik2020/ferroforge", rev = "96da6f1b74e1b2e8d8e67405db0179dba85f90cd" }
# FerroHAL's pin, as ferroforge-stm32's. `rt` gives RTIC its vector table,
# `rtic` the `Peripherals::steal` that `peripherals = true` names.
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "d9ddc472eae17a335dd6fdd217af3c4dc4050d1b", features = ["stm32f401re", "rt", "rtic", "defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "=2.2.1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
