[package]
name = "nucleo-h753zi-event-adc"
version = "0.1.0"
edition = "2024"
publish = false

# PROTOTYPE: the event port and ADC port benches on the Nucleo-H753ZI
# (MB1364), over FerroHAL's links Z1 and Z10 (src/lib.rs). E is
# `exti_line`, K `timer_tick`, A `adc_scan`, P `adc_event_port`, and TP the
# tick kicking P. The tick's rate
# is the build's `TICK_HZ` (1 kHz without it); `ch16` gives P sixteen
# channels in place of three.
[lib]
test = false
bench = false

[features]
ch16 = []

[dependencies]
ferroforge-stm32 = { path = "../..", features = ["prototype-timing"] }
ferroforge = { git = "https://github.com/Eirik2020/ferroforge", rev = "a3e8c0b021203b904fb293e50a5df12bf71dca13" }
# FerroHAL's pin, as ferroforge-stm32's. `rt` gives RTIC its vector table,
# `rtic` the `Peripherals::steal` that `peripherals = true` names.
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "ceaedbf97e6d059e168fd3eaecddf5fe39f7b7a9", features = ["stm32h753zi", "rt", "rtic", "defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "=2.2.1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
