[package]
name = "nucleo-h753zi-uart-loopback"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "uart-loopback"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferroforge-stm32 = { path = "../.." }
ferroforge = { git = "https://github.com/Eirik2020/ferroforge", rev = "f7387ed67ca29e194c8938d0db03f735c59480d7" }
# FerroHAL's pin, as ferroforge-stm32's. `rt` gives RTIC its vector table,
# `rtic` the `Peripherals::steal` that `peripherals = true` names.
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "a393e293b1dba489d0f88837ddbf5e99ae5e7990", features = ["stm32h753zi", "rt", "rtic", "defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
