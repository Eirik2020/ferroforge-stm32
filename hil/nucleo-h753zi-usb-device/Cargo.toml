[package]
name = "nucleo-h753zi-usb-device"
version = "0.1.0"
edition = "2024"
publish = false

# PROTOTYPE bench: the two USB port variants, one image each.
[[bin]]
name = "usb-deferred"
path = "src/bin/usb_deferred.rs"
test = false
bench = false

[[bin]]
name = "usb-polled"
path = "src/bin/usb_polled.rs"
test = false
bench = false

[dependencies]
ferroforge-stm32 = { path = "../..", features = ["usb"] }
ferroforge = { git = "https://github.com/Eirik2020/ferroforge", rev = "f7387ed67ca29e194c8938d0db03f735c59480d7" }
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "a393e293b1dba489d0f88837ddbf5e99ae5e7990", features = ["stm32h753zi", "rt", "rtic", "defmt", "usb"] }
usbd-serial = "=0.2.2"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "=2.2.1", default-features = false, features = ["cortex-m-systick", "systick-64bit"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
