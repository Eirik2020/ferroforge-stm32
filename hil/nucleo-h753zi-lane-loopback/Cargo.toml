[package]
name = "nucleo-h753zi-lane-loopback"
version = "0.1.0"
edition = "2024"
publish = false

# PROTOTYPE: the timer lane port loopback, variant T (`compare_lanes`, the
# firmware's task switching to listen) and variant F (`lanes_frame`, the
# port switching in its own interrupt), sharing the board (src/lib.rs) and
# the checks (../lane-common/loopback.rs). Two lanes.
[lib]
test = false
bench = false

[features]
# Two lanes only on this board; the feature keeps the binaries' source
# shared in shape with the F401's.
default = ["lanes2"]
lanes2 = []

[dependencies]
ferroforge-stm32 = { path = "../.." }
ferroforge = { git = "https://github.com/Eirik2020/ferroforge", rev = "a3e8c0b021203b904fb293e50a5df12bf71dca13" }
# FerroHAL's pin, as ferroforge-stm32's. `rt` gives RTIC its vector table,
# `rtic` the `Peripherals::steal` that `peripherals = true` names.
ferrohal-stm32 = { git = "https://github.com/Eirik2020/ferrohal-stm32", rev = "ceaedbf97e6d059e168fd3eaecddf5fe39f7b7a9", features = ["stm32h753zi", "rt", "rtic", "defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
